<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Learniverse</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🌎 Learniverse</div>
    </header>

    <section class="courses">

        <h2>Choose a Course</h2>

        <div class="course-grid">

            <div class="course-card" data-course="english">
                <h3>English</h3>
                <p>Learn English vocabulary and grammar.</p>
            </div>

            <div class="course-card" data-course="math">
                <h3>Mathematics</h3>
                <p>Practice math skills.</p>
            </div>

            <div class="course-card" data-course="programming">
                <h3>Programming</h3>
                <p>Learn coding fundamentals.</p>
            </div>

        </div>

    </section>

    <script type="module" src="js/courses.js"></script>

</body>
</html>
