<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path - Learniverse</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/path.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🌎 Learniverse</div>
    </header>

    <main class="path-page">

        <h1 id="courseTitle">Learning Path</h1>

        <div class="path-map">

            <div class="path-node completed">
                ✓
            </div>

            <div class="path-line"></div>

            <div class="path-node current">
                2
            </div>

            <div class="path-line"></div>

            <div class="path-node locked">
                🔒
            </div>

            <div class="path-line"></div>

            <div class="path-node locked">
                🔒
            </div>

        </div>

        <button id="startLesson">
            Start Lesson
        </button>

    </main>

    <script type="module" src="js/path.js"></script>

</body>
</html>
